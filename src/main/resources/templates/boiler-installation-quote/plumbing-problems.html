<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Plumbing Problems</title>

    <link rel="stylesheet" th:href="@{/css/style.css(v='20260910-1800')}">
</head>
<body>

<div th:replace="~{fragments/_header :: header}"></div>

<main class="container">
    <section class="section">

        <a th:if="${backUrl != null}"
           th:href="${backUrl}"
           class="back-link"
           aria-label="Go back">← Back</a>

        <h2>
            What <span style="color:#ff5a3c;">plumbing issue</span> do you have?
        </h2>
        <p class="section-subtitle">Select all that apply.</p>

        <div class="gas-appliance-grid plumbing-problem-grid">
            <label class="gas-appliance-card plumbing-problem-card"
                   th:each="problem : ${plumbingProblemOptions}">
                <input class="gas-appliance-checkbox plumbing-problem-checkbox"
                       type="checkbox"
                       name="problems"
                       th:value="${problem.value}"
                       th:checked="${#lists.contains(selectedPlumbingProblems, problem.value)}">
                <span class="gas-appliance-title" th:text="${problem.label}">Leaking tap</span>
                <span class="gas-appliance-pill">Add</span>
            </label>
        </div>

        <div class="gas-appliance-actions">
            <span class="gas-appliance-action-hint">Select all that apply</span>
            <button type="button"
                    class="gas-appliance-continue"
                    onclick="submitPlumbingProblems()">
                Continue
            </button>
        </div>

        <p id="result" class="quote-result" aria-live="polite"></p>
    </section>
</main>

<div th:replace="~{fragments/_footer :: footer}"></div>

<script th:inline="javascript">
    const quoteApiBasePath = /*[[${quoteApiBasePath}]]*/ "/quote";
    const resultElement = document.getElementById("result");

    async function submitPlumbingProblems() {
        clearError();

        const problems = Array.from(document.querySelectorAll(".plumbing-problem-checkbox:checked"))
            .map(input => input.value);

        if (problems.length === 0) {
            showError("Please select at least one plumbing problem.");
            return;
        }

        try {
            const response = await fetch(`${quoteApiBasePath}/plumbing-problems`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ problems })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                handleError(data);
                return;
            }

            window.location.href = data.nextStep;
        } catch (error) {
            console.error("Plumbing problems error:", error);
            showError("Something went wrong. Please try again.");
        }
    }

    function handleError(data) {
        const message = data?.message;
        showError(message || "Something went wrong. Please try again.");
    }

    function showError(message) {
        resultElement.textContent = "❌ " + message;
    }

    function clearError() {
        resultElement.textContent = "";
    }
</script>

</body>
</html>
