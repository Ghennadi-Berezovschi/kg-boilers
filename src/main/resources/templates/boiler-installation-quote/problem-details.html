<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Problem Details</title>

    <link rel="stylesheet" th:href="@{/css/style.css(v='20260903-2100')}">
</head>
<body>

<div th:replace="~{fragments/_header :: header}"></div>

<main class="container">
    <section class="section">

        <a th:if="${backUrl != null}"
           th:href="${backUrl}"
           class="back-link"
           aria-label="Go back">← Back</a>

        <h2 style="margin-bottom:32px;">
            <span style="color:#ff5a3c;">Please describe</span> the issue
        </h2>

        <div class="card" style="max-width:720px; margin:0 auto; padding:28px;">
            <label for="problemDetails"
                   style="display:block; margin-bottom:4px; font-weight:700; color:var(--blue-main);">
                Please describe the issue
            </label>

            <p style="font-size:14px; color:#6E7784; margin:0 0 10px;">
                A short description is enough.
            </p>

            <textarea id="problemDetails"
                      class="quote-input"
                      rows="5"
                      maxlength="500"
                      th:text="${problemDetails}"
                      th:placeholder="${gasCookerHobInstallationService}
                              ? 'Example: new hob, cooker replacement, freestanding cooker connection'
                              : 'For example: cylinder leaking, no hot water, low pressure, strange noise'"
                      style="width:100%; min-height:140px; padding:16px; resize:vertical;"></textarea>

            <div th:if="${gasCookerHobInstallationService}"
                 class="installation-choice-group">
                <p class="installation-choice-title">Choose installation type</p>
                <p class="installation-choice-hint">Please choose gas hob or gas cooker installation.</p>

                <label class="installation-choice-card">
                    <input type="radio"
                           name="installationAppliance"
                           value="gas-hob"
                           th:checked="${selectedInstallationAppliance == 'gas-hob'}">
                    <span class="installation-choice-copy">
                        <span class="installation-choice-name">Gas hob (standard) installation</span>
                    </span>
                    <strong class="installation-choice-price">£<span th:text="${gasHobInstallationPriceGbp}">140</span></strong>
                </label>

                <label class="installation-choice-card">
                    <input type="radio"
                           name="installationAppliance"
                           value="gas-cooker"
                           th:checked="${selectedInstallationAppliance == 'gas-cooker'}">
                    <span class="installation-choice-copy">
                        <span class="installation-choice-name">Gas cooker (standard) installation</span>
                    </span>
                    <strong class="installation-choice-price">£<span th:text="${gasCookerInstallationPriceGbp}">140</span></strong>
                </label>
            </div>

            <div class="problem-details-actions">
                <button type="button" id="problemDetailsBtn" class="card-cta">Continue →</button>
            </div>
        </div>

        <p id="result" class="quote-result" aria-live="polite"></p>
    </section>
</main>

<div th:replace="~{fragments/_footer :: footer}"></div>

<script th:inline="javascript">
    const resultElement = document.getElementById("result");
    const detailsField = document.getElementById("problemDetails");
    const continueButton = document.getElementById("problemDetailsBtn");
    const quoteApiBasePath = /*[[${quoteApiBasePath}]]*/ "/quote";
    const gasCookerHobInstallationService = /*[[${gasCookerHobInstallationService}]]*/ false;

    detailsField.addEventListener("input", clearError);
    continueButton.addEventListener("click", submitProblemDetails);

    async function submitProblemDetails() {
        clearError();

        const problemDetails = detailsField.value.trim();

        if (!problemDetails) {
            showError("Please describe the issue");
            detailsField.focus();
            return;
        }

        if (problemDetails.length > 500) {
            showError("Please keep the problem description under 500 characters");
            detailsField.focus();
            return;
        }

        const selectedInstallation = document.querySelector("input[name='installationAppliance']:checked");

        if (gasCookerHobInstallationService && !selectedInstallation) {
            showError("Please choose gas hob or gas cooker installation");
            return;
        }

        setLoading(true);

        try {
            const payload = { problemDetails: problemDetails };
            if (selectedInstallation) {
                payload.installationAppliance = selectedInstallation.value;
            }

            const response = await fetch(`${quoteApiBasePath}/problem-details`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                handleError(data);
                return;
            }

            window.location.href = data.nextStep;
        } catch (error) {
            console.error("Problem details error:", error);
            showError("Something went wrong. Please try again.");
        } finally {
            setLoading(false);
        }
    }

    function handleError(data) {
        const message = data?.message;
        showError(message || "Something went wrong. Please try again.");
    }

    function showError(message) {
        resultElement.textContent = "❌ " + message;
    }

    function clearError() {
        resultElement.textContent = "";
    }

    function setLoading(isLoading) {
        continueButton.disabled = isLoading;
        continueButton.textContent = isLoading ? "Saving..." : "Continue →";
    }
</script>

</body>
</html>
