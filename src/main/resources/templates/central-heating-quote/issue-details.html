<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Central Heating Issue Details</title>

    <link rel="stylesheet" th:href="@{/css/style.css(v='20260910-1800')}">
</head>
<body>

<div th:replace="~{fragments/_header :: header}"></div>

<main class="container">
    <section class="section">

        <a th:if="${backUrl != null}"
           th:href="${backUrl}"
           class="back-link"
           aria-label="Go back">← Back</a>

        <h2 style="margin-bottom:32px;">
            <span style="color:#ff5a3c;">Please describe</span> the issue
        </h2>

        <div class="card" style="max-width:720px; margin:0 auto; padding:28px;">
            <label for="issueDetails"
                   style="display:block; margin-bottom:12px; font-weight:700; color:var(--blue-main);">
                Please describe the issue
            </label>

            <textarea id="issueDetails"
                      class="quote-input"
                      rows="5"
                      maxlength="500"
                      required
                      th:text="${issueDetails}"
                      placeholder="For example: radiator leak in bedroom, radiators are cold upstairs, valves need replacing"
                      style="width:100%; min-height:140px; padding:16px; resize:vertical;"></textarea>

            <div class="problem-details-actions">
                <button type="button" id="issueDetailsBtn" class="card-cta">Continue →</button>
            </div>
        </div>

        <p id="result" class="quote-result" aria-live="polite"></p>
    </section>
</main>

<div th:replace="~{fragments/_footer :: footer}"></div>

<script>
    const resultElement = document.getElementById("result");
    const detailsField = document.getElementById("issueDetails");
    const continueButton = document.getElementById("issueDetailsBtn");

    detailsField.addEventListener("input", clearError);
    continueButton.addEventListener("click", submitIssueDetails);

    async function submitIssueDetails() {
        clearError();

        const issueDetails = detailsField.value.trim();

        if (!issueDetails) {
            showError("Please describe the issue");
            detailsField.focus();
            return;
        }

        if (issueDetails.length > 500) {
            showError("Please keep the problem description under 500 characters");
            detailsField.focus();
            return;
        }

        setLoading(true);

        try {
            const response = await fetch("/central-heating-quote/issue-details", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    issueDetails: issueDetails
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                handleError(data);
                return;
            }

            window.location.href = data.nextStep;
        } catch (error) {
            console.error("Issue details error:", error);
            showError("Something went wrong. Please try again.");
        } finally {
            setLoading(false);
        }
    }

    function handleError(data) {
        const message = data?.message;
        showError(message || "Something went wrong. Please try again.");
    }

    function showError(message) {
        resultElement.textContent = "❌ " + message;
    }

    function clearError() {
        resultElement.textContent = "";
    }

    function setLoading(isLoading) {
        continueButton.disabled = isLoading;
        continueButton.textContent = isLoading ? "Saving..." : "Continue →";
    }
</script>

</body>
</html>
