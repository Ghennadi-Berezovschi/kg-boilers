<th:block th:fragment="analytics" th:if="${analytics != null and analytics.enabled}">
    <link rel="stylesheet" th:href="@{/css/analytics.css(v='20261107')}">
    <aside id="analytics-consent" class="analytics-consent" hidden aria-label="Cookie choices"
           th:attr="data-measurement-id=${analytics.measurementId},data-lead-submitted=${contactSuccess == true or callbackSuccess == true}">
        <div class="analytics-consent-actions">
            <button type="button" data-analytics-accept>Accept cookies</button>
            <button type="button" data-analytics-reject>Reject cookies</button>
        </div>
    </aside>
    <script defer th:src="@{/js/analytics.js(v='20261106b')}"></script>
</th:block>
